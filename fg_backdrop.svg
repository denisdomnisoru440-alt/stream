<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="544" viewBox="0 0 1280 544">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(75,0,130,0.15)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="544" fill="url(#bg)"/>
  <rect width="1280" height="544" fill="url(#glow)"/>
  <!-- Quahog skyline silhouette -->
  <rect x="0" y="400" width="1280" height="144" fill="#1a1a2e"/>
  <!-- Buildings -->
  <rect x="50" y="340" width="60" height="100" fill="#222244"/>
  <rect x="130" y="300" width="40" height="140" fill="#222244"/>
  <rect x="200" y="360" width="80" height="80" fill="#222244"/>
  <rect x="350" y="320" width="50" height="120" fill="#222244"/>
  <rect x="900" y="330" width="70" height="110" fill="#222244"/>
  <rect x="1000" y="290" width="45" height="150" fill="#222244"/>
  <rect x="1100" y="350" width="90" height="90" fill="#222244"/>
  <rect x="1200" y="310" width="55" height="130" fill="#222244"/>
  <!-- Street lights -->
  <circle cx="300" cy="380" r="4" fill="#FFD700" opacity="0.6"/>
  <circle cx="640" cy="375" r="4" fill="#FFD700" opacity="0.6"/>
  <circle cx="980" cy="380" r="4" fill="#FFD700" opacity="0.6"/>
  <!-- Stars -->
  <circle cx="100" cy="60" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="300" cy="40" r="1" fill="white" opacity="0.3"/>
  <circle cx="500" cy="80" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="700" cy="50" r="1" fill="white" opacity="0.3"/>
  <circle cx="900" cy="70" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="1100" cy="45" r="1" fill="white" opacity="0.3"/>
  <circle cx="1200" cy="90" r="1.5" fill="white" opacity="0.5"/>
  <!-- Title -->
  <text x="640" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="72" fill="white" letter-spacing="4" opacity="0.9">FAMILY GUY</text>
  <text x="640" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#FFD700" letter-spacing="8" opacity="0.7">КУАХОГ</text>
  <!-- Bottom gradient -->
  <rect y="440" width="1280" height="104" fill="url(#bg)" opacity="0.8"/>
</svg>