<svg xmlns="http://www.w3.org/2000/svg" width="342" height="513" viewBox="0 0 342 513">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <rect width="342" height="513" fill="url(#bg)"/>
  <!-- Silhouette of Peter Griffin shape -->
  <ellipse cx="171" cy="160" rx="55" ry="60" fill="#2a2a4e"/>
  <ellipse cx="171" cy="160" rx="40" ry="45" fill="#333366"/>
  <!-- Eyes -->
  <circle cx="155" cy="148" r="14" fill="white"/>
  <circle cx="187" cy="148" r="14" fill="white"/>
  <circle cx="157" cy="148" r="6" fill="#1a1a2e"/>
  <circle cx="189" cy="148" r="6" fill="#1a1a2e"/>
  <!-- Smile -->
  <path d="M148 170 Q171 195 194 170" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Body -->
  <rect x="140" y="210" width="62" height="80" rx="10" fill="#2a2a4e"/>
  <!-- White shirt line -->
  <line x1="171" y1="215" x2="171" y2="285" stroke="#444488" stroke-width="2"/>
  <!-- Title -->
  <text x="171" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="36" fill="white" letter-spacing="2">FAMILY</text>
  <text x="171" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="36" fill="#FFD700" letter-spacing="2">GUY</text>
  <!-- Season badge -->
  <rect x="121" y="420" width="100" height="28" rx="14" fill="rgba(255,215,0,0.15)" stroke="#FFD700" stroke-width="1"/>
  <text x="171" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#FFD700" font-weight="600">СЕЗОН 21</text>
  <!-- Shine overlay -->
  <rect width="342" height="513" fill="url(#shine)"/>
</svg>