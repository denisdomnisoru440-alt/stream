<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Зеркальный план квартиры — ЖК LEVEL Причальный</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    min-height: 100vh;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 6px;
    color: #a8d8ea;
  }
  .subtitle {
    color: #888;
    margin-bottom: 20px;
    font-size: 14px;
  }
  .mirror-wrap {
    transform: scaleX(-1);
    background: #16213e;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
    max-width: 100%;
    overflow: auto;
  }
  .mirror-wrap svg { display: block; }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 18px;
    justify-content: center;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
  }
  .legend-color {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .toggle-btn {
    margin-top: 14px;
    padding: 8px 24px;
    background: #0f3460;
    color: #a8d8ea;
    border: 1px solid #a8d8ea;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  .toggle-btn:hover { background: #1a5276; }
  .light {
    background: #f0f0f0;
    color: #222;
  }
  .light .mirror-wrap {
    background: #fff;
    box-shadow: 0 0 20px rgba(0,0,0,0.15);
  }
  .light .mirror-wrap text { fill: #222 !important; }
  .light .subtitle { color: #666; }
  .light .legend-item { color: #444; }
</style>
</head>
<body>
<h1>Дизайн-проект однокомнатной квартиры</h1>
<div class="subtitle">ЖК LEVEL Причальный · 2026 г. · План зеркально отражён</div>

<div class="mirror-wrap">
<svg viewBox="0 0 580 460" width="870" height="690" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="580" height="460" fill="#1a1a2e" stroke="#555" stroke-width="2"/>

  <!-- Прихожая (1) -->
  <polygon points="0,0 140,0 140,200 0,200" fill="#2d4059" stroke="#a8d8ea" stroke-width="1.5"/>
  <text x="70" y="90" fill="#e0e0e0" font-size="14" text-anchor="middle">Прихожая</text>
  <text x="70" y="110" fill="#aaa" font-size="11" text-anchor="middle">4,22 м²</text>

  <!-- Гардеробная (5) -->
  <polygon points="0,200 140,200 140,280 0,280" fill="#3b4d61" stroke="#a8d8ea" stroke-width="1.5"/>
  <text x="70" y="234" fill="#e0e0e0" font-size="12" text-anchor="middle">Гардеробная</text>
  <text x="70" y="252" fill="#aaa" font-size="11" text-anchor="middle">2,65 м²</text>

  <!-- Ванная (4) -->
  <polygon points="0,280 140,280 140,400 0,400" fill="#4a6fa5" stroke="#a8d8ea" stroke-width="1.5"/>
  <text x="70" y="334" fill="#e0e0e0" font-size="13" text-anchor="middle">Ванная</text>
  <text x="70" y="352" fill="#aaa" font-size="11" text-anchor="middle">4,19 м²</text>

  <!-- Коридор -->
  <rect x="140" y="0" width="20" height="400" fill="#1a1a2e" stroke="#a8d8ea" stroke-width="1"/>

  <!-- Кухня (2) -->
  <polygon points="160,0 400,0 400,220 160,220" fill="#5c4d3c" stroke="#a8d8ea" stroke-width="1.5"/>
  <text x="280" y="100" fill="#e0e0e0" font-size="14" text-anchor="middle">Кухня</text>
  <text x="280" y="120" fill="#aaa" font-size="11" text-anchor="middle">9,8 м²</text>

  <!-- Комната (3) -->
  <polygon points="160,220 400,220 400,460 160,460" fill="#5b7553" stroke="#a8d8ea" stroke-width="1.5"/>
  <text x="280" y="330" fill="#e0e0e0" font-size="14" text-anchor="middle">Комната</text>
  <text x="280" y="350" fill="#aaa" font-size="11" text-anchor="middle">14,64 м²</text>

  <!-- Лоджия -->
  <polygon points="400,220 580,220 580,460 400,460" fill="#3a4a5c" stroke="#a8d8ea" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="490" y="340" fill="#e0e0e0" font-size="13" text-anchor="middle">Лоджия</text>

  <!-- Дверные проёмы -->
  <rect x="140" y="60" width="20" height="36" fill="#1a1a2e" stroke="#a8d8ea" stroke-width="1"/>
  <rect x="140" y="240" width="20" height="36" fill="#1a1a2e" stroke="#a8d8ea" stroke-width="1"/>
  <rect x="140" y="310" width="20" height="36" fill="#1a1a2e" stroke="#a8d8ea" stroke-width="1"/>
  <rect x="330" y="220" width="40" height="18" fill="#1a1a2e" stroke="#a8d8ea" stroke-width="1"/>

  <!-- Размеры -->
  <line x1="0" y1="448" x2="580" y2="448" stroke="#666" stroke-width="1"/>
  <line x1="0" y1="443" x2="0" y2="453" stroke="#666" stroke-width="1"/>
  <line x1="580" y1="443" x2="580" y2="453" stroke="#666" stroke-width="1"/>
  <text x="290" y="445" fill="#888" font-size="10" text-anchor="middle">~ 5800 мм</text>

  <line x1="565" y1="0" x2="565" y2="460" stroke="#666" stroke-width="1"/>
  <line x1="560" y1="0" x2="570" y2="0" stroke="#666" stroke-width="1"/>
  <line x1="560" y1="460" x2="570" y2="460" stroke="#666" stroke-width="1"/>
  <text x="548" y="235" fill="#888" font-size="10" text-anchor="middle" transform="rotate(-90,548,235)">~ 4000 мм</text>

  <!-- Номера помещений -->
  <circle cx="28" cy="28" r="14" fill="#e94560" opacity="0.85"/>
  <text x="28" y="32" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">1</text>

  <circle cx="28" cy="240" r="14" fill="#e94560" opacity="0.85"/>
  <text x="28" y="244" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">5</text>

  <circle cx="28" cy="330" r="14" fill="#e94560" opacity="0.85"/>
  <text x="28" y="334" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">4</text>

  <circle cx="190" cy="24" r="14" fill="#e94560" opacity="0.85"/>
  <text x="190" y="28" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">2</text>

  <circle cx="190" cy="245" r="14" fill="#e94560" opacity="0.85"/>
  <text x="190" y="249" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">3</text>
</svg>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-color" style="background:#2d4059"></div>Прихожая (1)</div>
  <div class="legend-item"><div class="legend-color" style="background:#3b4d61"></div>Гардеробная (5)</div>
  <div class="legend-item"><div class="legend-color" style="background:#4a6fa5"></div>Ванная (4)</div>
  <div class="legend-item"><div class="legend-color" style="background:#5c4d3c"></div>Кухня (2)</div>
  <div class="legend-item"><div class="legend-color" style="background:#5b7553"></div>Комната (3)</div>
  <div class="legend-item"><div class="legend-color" style="background:#3a4a5c; border:1px dashed #888"></div>Лоджия</div>
</div>

<button class="toggle-btn" onclick="document.body.classList.toggle('light')">Светлая тема</button>
</body>
</html>
